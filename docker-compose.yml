services:
  bullsnbier:
    build: .
    image: bullsnbier:latest
    container_name: bullsnbier
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"   # Host-Port in .env: PORT=6660
    environment:
      - ACCESS_KEY=${ACCESS_KEY:-}   # leer = offen · gesetzt = einmal /?key=… öffnen
    volumes:
      - ./data-docker:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
